name: VLAN Mgmt CI/CD

# Run when a PR targets main, or main receives a merge.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# The workflow only needs to read repository contents.
permissions:
  contents: read

jobs:
  validate:
    name: Validate network change
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate VLANs and generate configuration
        run: python scripts/build_config.py

      - name: Save configuration preview
        uses: actions/upload-artifact@v4
        with:
          name: configuration-preview
          path: rendered/vlans.cfg
          if-no-files-found: error

  deliver:
    name: Deliver approved configuration
    needs: validate

    # Deliver only after changes reach main.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Download validated configuration
        uses: actions/download-artifact@v4
        with:
          name: configuration-preview
          path: approved

      - name: Publish approved configuration
        uses: actions/upload-artifact@v4
        with:
          name: approved-config-${{ github.sha }}
          path: approved/vlans.cfg
          if-no-files-found: error
